version: 2

project_name: go-sync

builds:
  - id: go-sync
    main: ./cmd/go-sync
    binary: go-sync
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - "386"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
  - id: go-sync-server
    main: ./cmd/go-sync-server
    binary: go-sync-server
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
    goarch:
      - amd64
      - "386"
    ignore:
      - goos: linux
        goarch: "386"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: windows
    ids:
      - go-sync
    formats:
      - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "386" }}x86{{ else }}x64{{ end }}
    files:
      - README.md
      - config.example.json
      - config.sqlserver.example.json
      - config.sqlserver-legacy.example.json
      - config.mysql.example.json
      - config.grpc.example.json
      - docs/**
  - id: server
    ids:
      - go-sync-server
    formats:
      - zip
    name_template: >-
      {{ .ProjectName }}-server_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "386" }}x86{{ else }}x64{{ end }}
    files:
      - README.md
      - server.config.example.json
      - docs/**

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  prerelease: auto
