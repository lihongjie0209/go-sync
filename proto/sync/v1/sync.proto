syntax = "proto3";

package gosync.v1;

option go_package = "go-sync/internal/rpc/syncv1;syncv1";

service Replication {
  rpc Connect(stream CollectorFrame) returns (stream ServerFrame);
}

service Admin {
  rpc ListSyncers(ListSyncersRequest) returns (ListSyncersResponse);
  rpc ReloadConfig(ReloadConfigRequest) returns (ReloadConfigResponse);
}

message CollectorFrame {
  oneof body {
    Hello hello = 1;
    Event event = 2;
    ReplayUnavailable replay_unavailable = 3;
    Metrics metrics = 4;
    Idle idle = 5;
    ReconcileResult reconcile_result = 6;
    RepairAccepted repair_accepted = 7;
    ResumeAccepted resume_accepted = 8;
  }
}

message ServerFrame {
  oneof body {
    Pull pull = 1;
    Ack ack = 2;
    ReconcileRequest reconcile = 3;
    RepairRequest repair = 4;
    ResumeRequest resume = 5;
  }
}

message Hello {
  string syncer_id = 1;
  string generation = 2;
  uint64 earliest_seq = 3;
  uint64 ready_seq = 4;
  string protocol_version = 5;
  bool reconcile_supported = 6;
}

message Event {
  uint64 seq = 1;
  string message_id = 2;
  bytes json = 3;
}

message ReplayUnavailable {
  uint64 requested_seq = 1;
  uint64 earliest_seq = 2;
}

message Idle {
  uint64 ready_seq = 1;
}

message Pull {
  string generation = 1;
  uint64 seq = 2;
}

message Ack {
  string generation = 1;
  uint64 seq = 2;
  string message_id = 3;
}

message ReconcileRequest {
  string request_id = 1;
  string source_schema = 2;
  string table = 3;
  uint32 buckets = 4;
  bool all_buckets = 5;
  uint32 bucket = 6;
  bool include_rows = 7;
  uint32 timeout_seconds = 8;
}

message BucketDigest {
  uint32 bucket = 1;
  uint64 rows = 2;
  string digest = 3;
}

message ReconcileResult {
  string request_id = 1;
  string source_schema = 2;
  string table = 3;
  repeated string columns = 4;
  repeated string primary_keys = 5;
  repeated BucketDigest digests = 6;
  bytes rows_json = 7;
  string error = 8;
  repeated string column_types = 9;
}

message RepairRequest {
  string request_id = 1;
  string reason = 2;
}

message RepairAccepted {
  string request_id = 1;
}

message ResumeRequest {
  string request_id = 1;
}

message ResumeAccepted {
  string request_id = 1;
}

// Metrics contains one Prometheus text exposition snapshot. The server adds
// trusted syncer_id and component labels before forwarding it.
message Metrics {
  bytes prometheus_text = 1;
  int64 collected_at_unix_milli = 2;
}

message ListSyncersRequest {}

message SyncerStatus {
  string id = 1;
  bool connected = 2;
  string generation = 3;
  uint64 received_seq = 4;
  uint64 applied_seq = 5;
  string error = 6;
}

message ListSyncersResponse {
  repeated SyncerStatus syncers = 1;
  string config_hash = 2;
  string last_reload_error = 3;
}

message ReloadConfigRequest {}

message ReloadConfigResponse {
  string config_hash = 1;
}
