name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify modules
        run: go mod verify
      - name: Verify tidy state
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.1"
      - name: Verify generated protobuf
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          protoc --go_out=. --go_opt=module=go-sync --go-grpc_out=. --go-grpc_opt=module=go-sync proto/sync/v1/sync.proto
          git diff --exit-code -- internal/rpc
      - name: Unit tests with race detector
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - name: Benchmark smoke tests
        run: go test -run '^$' -bench . -benchmem -benchtime=100ms -count=1 ./internal/event ./internal/queue ./internal/server
      - name: Validate release packages
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Upload snapshot packages
        uses: actions/upload-artifact@v7
        with:
          name: go-sync-snapshot
          path: |
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test PostgreSQL, SQL Server, MySQL 5.6, MySQL 5.7 and S3 with Testcontainers
        run: go test -race -count=1 -timeout=55m -tags=integration ./...
