name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    if: github.repository_owner == 'lihongjie0209'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify release source
        run: |
          go mod verify
          go vet ./...
          go test -race ./...
      - name: Build and publish GitHub Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mirror-release:
    name: Mirror release to cf-file
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Upload GitHub Release assets to cf-file
        uses: lihongjie0209/cf-file-upload-action@74e1ace4a3156dbaf99591f7dd854434f66e637b # v1.1.1
        with:
          password: ${{ secrets.CF_FILE_PASSWORD }}
          github-token: ${{ github.token }}
          retention-tags: '7'
